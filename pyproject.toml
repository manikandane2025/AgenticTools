[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "paccaassure-common-tools"
version = "0.1.0"
description = "PaccaAssure common tooling platform foundation with Excel, CSV, and PDF support."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "jsonschema==4.23.0",
  "openpyxl==3.1.5",
  "pdfminer.six==20260107",
  "pdfplumber==0.11.10",
  "pydantic==2.9.2",
  "pypdf==6.14.2",
  "python-dateutil==2.9.0.post0",
  "typing-extensions==4.12.2",
  "XlsxWriter==3.2.0",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "coverage[toml]==7.15.2",
  "cyclonedx-bom==7.3.0",
  "hypothesis==6.112.2",
  "mypy==1.11.2",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "reportlab==4.2.2",
  "ruff==0.6.8",
  "types-jsonschema==4.23.0.20240813",
  "types-openpyxl==3.1.5.20250919",
  "types-python-dateutil==2.9.0.20240906",
]

[project.scripts]
pacca-tools = "paccaassure_common_tools.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paccaassure_common_tools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/integration",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/Dockerfile",
  "/requirements.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RET"]
ignore = ["E501", "N818", "S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/integration/test_certification_and_cli.py" = ["S603", "S607"]
"tests/integration/test_package_content.py" = ["S603"]
"tests/unit/test_registry_and_policy.py" = ["B017"]
"scripts/generate_release_closure.py" = ["S603"]
"scripts/generate_first_release_code_quality.py" = ["S603"]

[tool.pytest.ini_options]
addopts = "--cov=src/paccaassure_common_tools --cov-report=term-missing --cov-report=xml --strict-markers"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: integration tests",
  "performance: performance tests",
  "security: security-focused tests",
]

[tool.coverage.run]
branch = true
source = ["src/paccaassure_common_tools"]

[tool.coverage.report]
fail_under = 65
show_missing = true
omit = ["tests/*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = []
mypy_path = ["src"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
